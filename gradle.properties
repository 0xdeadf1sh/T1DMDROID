# Local dev runs Gradle on the Android Studio JBR (JDK 21). The system JDK is 26,
# which is too new for AGP/Gradle 8.x — do NOT let Gradle default to it.
# Local JDK 21 (system JDK is 26 — too new for AGP 8.11). CI: override with
# `./gradlew -Dorg.gradle.java.home=$JAVA_HOME ...` pointing at a real JDK 21.
org.gradle.java.home=/home/omar/.gradle/jdks/eclipse_adoptium-21-amd64-linux.2

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
