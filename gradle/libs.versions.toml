# Single source of dependency versions for the whole build (main build + build-logic).
[versions]
agp = "8.11.1"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.1"
composeBom = "2024.12.01"
coroutines = "1.9.0"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
navigationCompose = "2.8.5"
room = "2.7.1"
sqlite = "2.5.1"
datastore = "1.1.1"
work = "2.10.0"
serialization = "1.7.3"
timber = "5.0.1"
# HTTP + WebSocket transport for :sync (REST outbox drain + /v1/stream). 4.x is the last
# JDK-8 baseline line; mockwebserver ships its WebSocket test server at the same version.
okhttp = "4.12.0"
# ExecuTorch Android runtime — MUST match the exporter's reported version (descriptor.json
# executorch_version). 1.3.1 ships arm64-v8a + x86_64 XNNPACK .so in the AAR.
executorch = "1.3.1"
junit = "4.13.2"
androidxJunit = "1.2.1"
# Glance app-widgets (home + lock glances; PLAN Phase 7 — a pre-approved dep). 1.1.x ships the
# appwidget + material3 artifacts against the AndroidX Compose runtime it bundles.
glance = "1.1.1"
# Native toolchain (consumed by :core:native — see t1dm.android.rust convention plugin):
ndk = "28.1.13356709"     # r28.x — required for Android 15/16 16 KB page alignment
uniffi = "0.29"           # host-verified 0.29.5; Rust FFI codegen (see :core:native)
jna = "5.14.0"            # runtime dep of the uniffi-generated Kotlin bindings (loads the cdylib)
# QR scanner for the Server-token affordance (Phase 7C item 12). Apache-2.0, embeds ZXing core;
# NO Google Play Services dependency (sideload-safe). Ships its own CaptureActivity + CAMERA request.
zxingEmbedded = "4.3.0"
# Image loader for :feature:pubs (Bluesky avatars / embed thumbnails). Coil 3; the
# coil-network-okhttp fetcher auto-registers via ServiceLoader and pins okhttp 4.12.0.
coil = "3.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
# ExecuTorch AAR (Gradle metadata pulls fbjni/soloader/kotlin-stdlib/core-ktx transitively).
executorch-android = { group = "org.pytorch", name = "executorch-android", version.ref = "executorch" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingEmbedded" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
# Build-logic classpath (Gradle plugin artifacts consumed by the convention plugins):
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

[bundles]
compose = ["androidx-compose-ui", "androidx-compose-ui-graphics", "androidx-compose-ui-tooling-preview", "androidx-compose-material3", "androidx-compose-foundation"]
coil = ["coil-compose", "coil-network-okhttp"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
