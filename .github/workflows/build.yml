name: build

# Phase 0 build gate: assemble both flavors of the Android app (job A) and run the
# Rust core's host tests (job B). NDK is intentionally NOT required — the
# t1dm.android.rust convention plugin is still a stub (no ndkVersion, no cargo-ndk),
# so assembleDebug builds without a cross-compiled .so.
on:
  push:
  pull_request:

jobs:
  # Job A — assemble the personal + public debug APKs.
  android:
    name: assemble debug (personal + public)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages (compileSdk 36)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Provides the Gradle dependency + build cache.
      - uses: gradle/actions/setup-gradle@v4

      - name: assembleDebug (both flavors)
        # gradle.properties pins org.gradle.java.home to a local Android Studio JBR that does
        # not exist on the runner; override it to the runner's temurin 21.
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assemblePersonalDebug assemblePublicDebug

  # Job B — host tests for the Rust correctness core (crate t1dm-core, member of the
  # workspace rooted at the repo; rustup honours ./rust-toolchain.toml, pinning 1.96.1).
  rust:
    name: cargo test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo test
        working-directory: crates/t1dm-core
        run: cargo test --all-targets
