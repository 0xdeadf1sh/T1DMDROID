name: rail-invariants

# BLOCKING safety gate (PLAN.private.md §3.6, Phase 4 §7). Runs the :calc host JVM property tests
# that pin the fail-closed dose-calculator invariants: every enabled rail BLOCKS on missing /
# degenerate / stale / collapsed input, "all-rails-off = identity", the predicted-low veto, the IOB
# ceiling, mandatory confirmation, the hypo carb-rescue path, and the structural no-actuator guard.
# The suite runs against a deterministic fake ForecastPort — no model / .pte needed on the runner.
on:
  push:
  pull_request:

jobs:
  rail-invariants:
    name: calc rail-invariant property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages (compileSdk 36)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins org.gradle.java.home to a local JBR that does not exist on the runner;
      # override it to the runner's temurin 21 (mirrors build.yml).
      - name: :calc host unit tests (rail invariants)
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :calc:testDebugUnitTest
