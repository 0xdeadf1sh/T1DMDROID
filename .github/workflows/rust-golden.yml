name: rust-golden

# Bit-for-bit gate for t1dm-core. No tables here: libre3-core runs its table-free tests only.
on:
  pull_request:

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo test both crates
        env:
          LIBRE3_TABLES_SKIP: "1"
        run: cargo test -p t1dm-core -p libre3-core
