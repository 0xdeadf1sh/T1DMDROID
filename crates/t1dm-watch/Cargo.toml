[package]
name = "t1dm-watch"
version = "0.0.0"
edition = "2021"
publish = false
description = "Watch link (T1DMCOMMON SPEC/watch.md): session crypto and wire codecs, shared by the phone and its peripherals."

[lib]
name = "t1dm_watch"

# No uniffi: T1DMKDE builds this for the desktop; t1dm-core wraps it for Kotlin.
[dependencies]
thiserror = "2"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[dev-dependencies]
serde_json = "1"
