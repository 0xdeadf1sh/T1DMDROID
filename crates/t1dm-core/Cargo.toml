[package]
name = "t1dm-core"
version = "0.0.0"
edition = "2021"
publish = false
description = "Correctness core for T1DMDROID (AiDEX decode, model pre/post, curves, watch crypto)."

[lib]
name = "t1dm_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# `cli` pulls in `uniffi::uniffi_bindgen_main`, used by the bindgen binary above to
# emit the Kotlin bindings in library mode. thiserror drives CoreError.
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
# Descriptor JSON parsing (PLAN §2.4). serde_json is the sole model-descriptor parse;
# the app never touches the `.pt` pickle.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Watch link crypto (PLAN §3, watch-link): X25519 ECDH → HKDF-SHA256 → per-direction
# AES-128-GCM, with a deterministic SAS. Well-reviewed RustCrypto/dalek primitives.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
# Rigid-body solver behind the in-app hill-climb minigame (`game`): oriented-polyline
# terrain, ball wheels on pin-slot suspension joints. Pinned exactly — the 0.34/0.29 line
# has only just moved its public math API from nalgebra to glam.
rapier2d = "=0.34.0"
