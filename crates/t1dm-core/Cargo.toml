[package]
name = "t1dm-core"
version = "0.0.0"
edition = "2021"
publish = false
description = "Correctness core for T1DMDROID (AiDEX decode, model pre/post, curves, watch crypto)."

[lib]
name = "t1dm_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# `cli` pulls in `uniffi::uniffi_bindgen_main`, used by the bindgen binary above to
# emit the Kotlin bindings in library mode. thiserror drives CoreError.
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
