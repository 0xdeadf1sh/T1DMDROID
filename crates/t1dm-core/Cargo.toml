[package]
name = "t1dm-core"
version = "0.0.0"
edition = "2021"
publish = false
description = "Correctness core for T1DMDROID (AiDEX decode, model pre/post, curves, watch crypto)."

[lib]
name = "t1dm_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# `cli` pulls in `uniffi::uniffi_bindgen_main`, used by the bindgen binary above to
# emit the Kotlin bindings in library mode. thiserror drives CoreError.
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
# Descriptor JSON parsing (PLAN §2.4). serde_json is the sole model-descriptor parse;
# the app never touches the `.pt` pickle.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Watch link session and codecs (T1DMCOMMON SPEC/watch.md); `watch.rs` is its uniffi face.
t1dm-watch = { path = "../t1dm-watch" }
sha2 = "0.10"
# AiDEX X connected-session crypto (CGM.md §4): the raw AES-128 block cipher (already
# vendored transitively via aes-gcm) driven in CFB128 by hand, plus MD5 key derivation
# from the serial. No `cfb-mode` dep — CFB128 is a dozen lines over `encrypt_block`.
aes = "0.8"
md-5 = "0.10"
# Rigid-body solver behind the in-app hill-climb minigame (`game`): oriented-polyline
# terrain, ball wheels on pin-slot suspension joints. Pinned exactly — the 0.34/0.29 line
# has only just moved its public math API from nalgebra to glam.
rapier2d = "=0.34.0"
