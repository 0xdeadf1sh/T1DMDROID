# Pins the toolchain + the Android cross targets. rustup honours this for both the host
# `cargo test` and the `cargo ndk` cross-build; both Android std targets must be
# installed (`rustup target add aarch64-linux-android x86_64-linux-android`).
[toolchain]
channel = "stable"
targets = ["aarch64-linux-android", "x86_64-linux-android"]
